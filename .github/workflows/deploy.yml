name: Deploy K3s and Airflow

on:
  push:
    branches: [ "main" ]
    paths: [ 'terraform/**' ]

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform  # Points all run steps to the terraform directory

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Set SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # $GITHUB_ENV only supports single-line KEY=VALUE by default; a
          # private key is multi-line, so it must use the delimiter syntax.
          DELIM=$(openssl rand -hex 8)
          echo "TF_VAR_private_key<<$DELIM" >> "$GITHUB_ENV"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "$DELIM" >> "$GITHUB_ENV"

      - name: Validate SSH key format
        run: |
          if ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "SSH key parses correctly."
          else
            echo "::error::~/.ssh/id_rsa is not a valid private key. Check the SSH_PRIVATE_KEY secret contains the full key (BEGIN/END lines included) with no extra encoding."
            exit 1
          fi

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        env:
          TF_VAR_key_name: "damsteele66-us-east-1"
        run: terraform apply -auto-approve

      - name: Get instance public IP
        id: tf_output
        run: echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH to be available
        run: |
          IP="${{ steps.tf_output.outputs.public_ip }}"
          for i in $(seq 1 30); do
            if nc -z -w3 "$IP" 22; then
              echo "SSH is up on $IP"
              exit 0
            fi
            echo "Waiting for SSH on $IP... ($i/30)"
            sleep 10
          done
          echo "SSH never came up" >&2
          exit 1

      - name: Set up Python (for Ansible)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: pip install ansible

      - name: Write dynamic inventory
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p ansible
          cat > ansible/inventory.ini << EOF
          [airflow_server]
          ${{ steps.tf_output.outputs.public_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
          EOF

      - name: Run Ansible playbook
        working-directory: ansible
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          AIRFLOW_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AIRFLOW_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: ansible-playbook -i inventory.ini playbook.yml
