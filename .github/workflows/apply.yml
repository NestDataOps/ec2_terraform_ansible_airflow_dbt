name: Apply Infrastructure

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PASSWORD }}
  TF_VAR_airflow_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_airflow_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_key_name: ${{ secrets.EC2_KEY_NAME }}
      TF_VAR_private_key: ${{ secrets.EC2_PRIVATE_KEY }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve

      - name: Get instance public IP
        id: tf_output
        run: echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH to be available
        run: |
          IP="${{ steps.tf_output.outputs.public_ip }}"
          for i in $(seq 1 30); do
            if nc -z -w3 "$IP" 22; then
              echo "SSH is up on $IP"
              exit 0
            fi
            echo "Waiting for SSH on $IP... ($i/30)"
            sleep 10
          done
          echo "SSH never came up" >&2
          exit 1

      - name: Set up Python (for Ansible)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: pip install ansible

      - name: Write SSH private key to file
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

      - name: Write dynamic inventory
        working-directory: ${{ github.workspace }}
        run: |
          cat > ansible/inventory.ini << EOF
          [airflow_server]
          ${{ steps.tf_output.outputs.public_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=/tmp/ec2_key.pem
          EOF

      - name: Run Ansible playbook
        working-directory: ansible
        env:
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          AIRFLOW_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AIRFLOW_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: ansible-playbook -i inventory.ini playbook.yml
