---
- name: Deploy Airflow + dbt via Docker on EC2
  hosts: airflow_server
  become: true
  vars:
    app_dir: /opt/airflow_docker
    snowflake_account: "IQFGCYU-UA55363"
    snowflake_warehouse: "japan_visa_wh"
    snowflake_database: "japan_visa_db"
    snowflake_role: "accountadmin"
    snowflake_login: "NESTDATAOPS"
    snowflake_password: "{{ lookup('env', 'SNOWFLAKE_PASSWORD') }}"
    airflow_aws_access_key_id: "{{ lookup('env', 'AIRFLOW_AWS_ACCESS_KEY_ID') }}"
    airflow_aws_secret_access_key: "{{ lookup('env', 'AIRFLOW_AWS_SECRET_ACCESS_KEY') }}"
    # Internal-only — Postgres has no port published to the host, so this
    # never leaves the instance's private Docker network. Not treated as a
    # sensitive GitHub secret for that reason.
    postgres_password: "airflow_internal_pw"

  tasks:
    - name: Install Docker prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        update_cache: true
        state: present

    - name: Check if swap file already exists
      stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create 2GB swap file (t3a.small only has 2GB RAM — no swap risks OOM kills)
      command: fallocate -l 2G /swapfile
      when: not swapfile_stat.stat.exists

    - name: Set swap file permissions
      file:
        path: /swapfile
        mode: "0600"
      when: not swapfile_stat.stat.exists

    - name: Format swap file
      command: mkswap /swapfile
      when: not swapfile_stat.stat.exists

    - name: Enable swap file
      command: swapon /swapfile
      when: not swapfile_stat.stat.exists

    - name: Persist swap file in fstab
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        update_cache: true
        state: present

    - name: Ensure Docker is running and enabled
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Dockerfile
      copy:
        src: docker/Dockerfile
        dest: "{{ app_dir }}/Dockerfile"

    - name: Copy init.sh
      copy:
        src: docker/init.sh
        dest: "{{ app_dir }}/init.sh"
        mode: "0755"

    - name: Copy docker-compose.yml
      copy:
        src: docker/docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"

    - name: Clone the DAGs/dbt repo (mounted into the container)
      git:
        repo: https://github.com/NestDataOps/airflow-dbt-snowflake-japan-visa.git
        dest: "{{ app_dir }}/repo"
        force: true

    - name: Write airflow.env (secrets for the container — never committed to git)
      copy:
        dest: "{{ app_dir }}/airflow.env"
        mode: "0600"
        content: |
          DBT_SNOWFLAKE_PASSWORD={{ snowflake_password }}
          SNOWFLAKE_ACCOUNT={{ snowflake_account }}
          SNOWFLAKE_USER={{ snowflake_login }}
          SNOWFLAKE_ROLE={{ snowflake_role }}
          SNOWFLAKE_DATABASE={{ snowflake_database }}
          SNOWFLAKE_WAREHOUSE={{ snowflake_warehouse }}
          AIRFLOW_AWS_ACCESS_KEY_ID={{ airflow_aws_access_key_id }}
          AIRFLOW_AWS_SECRET_ACCESS_KEY={{ airflow_aws_secret_access_key }}
          POSTGRES_PASSWORD={{ postgres_password }}
      no_log: true

    - name: Build and start the Airflow container
      command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"
